services:
  - type: web
    name: suraksha-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: openai            # OpenAI-compatible client, pointed at Groq
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: qwen/qwen3.8-27b     # llama-3.3-70b-versatile was retired by Groq
      - key: OPENAI_API_KEY
        sync: false              # paste your free Groq key in the Render dashboard
      - key: SECRET_KEY
        generateValue: true
